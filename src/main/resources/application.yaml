server:
  port: 8083
spring:
  application:
    name: ventas-service
  # NUEVO: pide su configuración al config-server (si no está, usa los valores de este archivo)
  config:
    import: optional:configserver:http://localhost:8888
  # Los valores siguientes son de respaldo: con el config-server activo, los entrega el servidor
  datasource:
    url: jdbc:postgresql://localhost:5433/ventas_db
    username: tambo
    password: tambo123
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: localhost
    port: 5672
    username: tambo
    password: tambo123
    listener:
      simple:
        default-requeue-rejected: false
  cloud:
    # Spring Cloud 2025.1 está certificado para Boot 4.0; con Boot 4.1 se desactiva solo la verificación
    # y se comprueba el funcionamiento con las pruebas del proyecto
    compatibility-verifier:
      enabled: false
    openfeign:
      client:
        config:
          # Timeouts del cliente Feign "catalogo-service" (en milisegundos)
          catalogo-service:
            connect-timeout: 2000   # máximo para establecer la conexión
            read-timeout: 3000      # máximo para recibir la respuesta
app:
  jwt:
    secret: tambo-market-clave-secreta-cibertec-2026-minimo-32
  catalogo:
    url: http://localhost:8082